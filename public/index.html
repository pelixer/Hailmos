<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hailmos">
<meta name="theme-color" content="#000000">
<meta name="description" content="Hailmos — 집중하는 동안 행성 사이를 항해하는 타이머">
<title>Hailmos</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Geist+Mono:wght@300;400&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#fff7ee}a:hover{color:#ffffff}
@keyframes hb-rot{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes hb-sheen{0%,35%{transform:translate(-120%,-120%) rotate(45deg)}75%,100%{transform:translate(120%,120%) rotate(45deg)}}
@keyframes hb-in{from{opacity:0;transform:translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes hb-fade{from{opacity:0}to{opacity:1}}
@keyframes hb-breathe{0%,100%{opacity:.75}50%{opacity:1}}
.hb-rot{animation:hb-rot 28s linear infinite}
.hb-rot-fast{animation:hb-rot 5.5s linear infinite}
.hb-sheen{animation:hb-sheen 7s cubic-bezier(.45,0,.2,1) infinite}
.hb-in{animation:hb-in 1.4s cubic-bezier(.16,1,.3,1) both}
.hb-cv{animation:hb-fade 1.8s ease both}
.hb-breathe{animation:hb-breathe 5s ease-in-out infinite}
.hb-rim{position:absolute;inset:0;border-radius:inherit;padding:1px;overflow:hidden;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.hb-glass{-webkit-backdrop-filter:blur(16px) saturate(170%) brightness(.6);backdrop-filter:blur(16px) saturate(170%) brightness(.6)}
.hb-lens{-webkit-backdrop-filter:brightness(2.3) saturate(1.35) contrast(1.08) blur(1px);backdrop-filter:brightness(2.3) saturate(1.35) contrast(1.08) blur(1px)}
.hb-dim{-webkit-backdrop-filter:blur(10px) brightness(.42) saturate(1.4);backdrop-filter:blur(10px) brightness(.42) saturate(1.4)}
.hb-veil{-webkit-backdrop-filter:blur(5px) brightness(.72);backdrop-filter:blur(5px) brightness(.72)}
.hb-btn{transition:transform .5s cubic-bezier(.16,1,.3,1)}
.hb-btn:active{transform:scale(.94)}

.rt-s::-webkit-scrollbar{display:none}.rt-s{scrollbar-width:none}
.rt-b{transition:background .25s ease,color .25s ease,border-color .25s ease,opacity .25s ease;-webkit-tap-highlight-color:transparent}
input.rt-q{background:transparent;border:0;outline:none;color:#fff3e2;font-family:'Michroma',sans-serif;font-size:10px;letter-spacing:.14em;width:100%}
input.rt-q::placeholder{color:rgba(255,234,210,0.35)}
@keyframes rt-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rt-toast{animation:rt-in .5s cubic-bezier(.16,1,.3,1) both}

input.rt-range{-webkit-appearance:none;appearance:none;width:100%;height:2px;border-radius:1px;outline:none;margin:0;cursor:pointer}
input.rt-range::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border:0;border-radius:12px;background:radial-gradient(circle,#fffaf2 0,#ffe2bd 16%,rgba(243,196,138,0.75) 30%,rgba(234,138,72,0.28) 52%,rgba(234,138,72,0) 72%)}
input.rt-range::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:12px;background:radial-gradient(circle,#fffaf2 0,#ffe2bd 16%,rgba(243,196,138,0.75) 30%,rgba(234,138,72,0.28) 52%,rgba(234,138,72,0) 72%)}

html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff7ee;font-family:'Geist Mono','Noto Sans KR',monospace;-webkit-font-smoothing:antialiased}
.layer{position:absolute;inset:0}
.fill{position:absolute;left:0;top:0;width:100%;height:100%}
#home .hui{top:env(safe-area-inset-top)!important;bottom:env(safe-area-inset-bottom)!important}
#voy{display:none}
#voy .vui{transition:opacity 1.4s ease}
#voy.introing .vui{opacity:0!important;pointer-events:none!important}
#voy.calm .vtext{opacity:0}
#home{background:#000}
#home .hui{transition:opacity .45s ease,filter .45s ease}
#home.leaving .hui{opacity:0;filter:blur(6px);pointer-events:none}
#sheet{transform:translateY(102%);transition:transform .6s cubic-bezier(.2,.8,.2,1);background:#000;z-index:5}
#sheet.open{transform:translateY(0)}
#log{transform:translateY(102%);transition:transform .6s cubic-bezier(.2,.8,.2,1);background:#000;z-index:6}
#log.open{transform:translateY(0)}
#landed{opacity:0;pointer-events:none;transition:opacity .8s ease;z-index:4}
#landed.on{opacity:1;pointer-events:auto}
.handle{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 6px);width:72px;height:30px;border:0;background:transparent;cursor:pointer;padding:0;z-index:2}
.handle span{display:block;width:36px;height:4px;border-radius:2px;margin:0 auto;background:rgba(255,226,190,0.35)}
</style>
</head>
<body>
<div id="stage">
  <!-- focus voyage (3D): sits under home so the opening can take over the very same pixels -->
  <div id="voy" class="layer introing">
    <canvas class="jh-gl fill" aria-label="항해 장면 — 우주선을 끌어 떼면 집중이 멈춥니다"></canvas>
    <div class="jh-tag vui" aria-live="polite" style="position:absolute;left:0;top:0;width:0;height:0;opacity:0;pointer-events:none">
      <svg class="jh-ld" width="176" height="64" viewBox="0 0 176 64" aria-hidden="true" style="position:absolute;left:0;top:0;overflow:visible;transform-origin:0 0">
        <path class="jh-lp" d="M 0 0 L 34 44 L 168 44" fill="none" stroke="rgba(255,226,190,0.62)" stroke-width="1" pathLength="100" stroke-dasharray="100" style="stroke-dashoffset:100;transition:stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1)"></path>
        <rect class="jh-dm" x="30.5" y="40.5" width="7" height="7" transform="rotate(45 34 44)" fill="none" stroke="#ffd9b0" stroke-width="1" style="opacity:0;transition:opacity .5s ease .5s"></rect>
      </svg>
      <div class="jh-tx" style="position:absolute;left:46px;top:20px;white-space:nowrap">
        <div class="jh-tn" style="font-family:'Michroma',sans-serif;color:#fff3e2;text-shadow:0 0 14px rgba(234,138,72,0.75),0 0 2px rgba(255,236,210,0.9)"></div>
        <div class="jh-td" style="margin-top:15px;font-size:9.5px;letter-spacing:0.12em;color:rgba(255,234,210,0.68)"></div>
      </div>
    </div>
    <div class="vui vtext" style="position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 48px);display:flex;flex-direction:column;align-items:center;pointer-events:none;transition:opacity 1s ease">
      <div class="jh-lb" style="font-family:'Michroma',sans-serif;color:#ece4ff;text-shadow:0 0 12px rgba(140,115,225,0.75);max-width:326px;margin:0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;letter-spacing:.42em;text-indent:.42em"></div>
      <div class="jh-tw" role="timer" style="position:relative;width:390px;height:92px;margin-top:2px">
        <canvas class="jh-tm" aria-hidden="true" style="position:absolute;left:0;top:0;width:390px;height:92px;transition:opacity .8s"></canvas>
      </div>
      <div class="jh-km" style="margin-top:2px;font-size:11px;letter-spacing:0.08em;color:rgba(232,224,255,0.55)"></div>
    </div>
    <div class="vui" style="position:absolute;left:18px;top:calc(env(safe-area-inset-top) + 10px)" id="v-home"><button aria-label="홈으로" class="hb-btn hb-veil" style="position: relative; width: 40px; height: 40px; border-radius: 20px; padding: 0; border: 0; display: flex; align-items: center; justify-content: center; background: rgba(8,5,10,0.12); box-shadow: inset 0 0 0 1px rgba(255,240,225,0.16)"><span aria-hidden="true" class="hb-rim"><span class="hb-rot-fast" style="position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; opacity: 0.6; background: conic-gradient(from 0deg, rgba(255,250,240,0) 0deg, rgba(255,250,240,0) 200deg, rgba(129,91,170,0.5) 255deg, #e49953 315deg, #fff6e8 352deg, rgba(255,250,240,0) 360deg)"></span></span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="position: relative; fill: none; stroke: #fff7ee; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 3px rgba(255,220,180,0.55))"><path d="M4.5 11.5L12 5l7.5 6.5"></path><path d="M7 10v8.5h10V10"></path><path d="M10.5 18.5v-4h3v4"></path></svg></button></div>
    <div class="vui" style="position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 28px);display:flex;justify-content:center" id="v-calm"><button aria-label="앰비언트 사운드" class="hb-btn hb-veil" style="position: relative; width: 52px; height: 52px; border-radius: 26px; padding: 0; border: 0; display: flex; align-items: center; justify-content: center; background: rgba(8,5,10,0.12); box-shadow: inset 0 0 0 1px rgba(255,240,225,0.16)"><span aria-hidden="true" class="hb-rim"><span class="hb-rot-fast" style="position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; opacity: 0.6; background: conic-gradient(from 0deg, rgba(255,250,240,0) 0deg, rgba(255,250,240,0) 200deg, rgba(129,91,170,0.5) 255deg, #e49953 315deg, #fff6e8 352deg, rgba(255,250,240,0) 360deg)"></span></span><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" style="position: relative; fill: none; stroke: #fff7ee; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 3px rgba(255,220,180,0.55))"><path d="M12 6v12"></path><path d="M8.5 9v6"></path><path d="M15.5 9v6"></path><path d="M5 11v2"></path><path d="M19 11v2"></path></svg></button></div>
  </div>

  <!-- home: the light streak -->
  <div id="home" class="layer">
    <canvas class="lg-streak hb-cv fill" aria-hidden="true"></canvas>
    <div class="hui" style="position:absolute;inset:0">
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 74%, rgba(0,0,0,0.42) 100%)"></div>
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 70px 0 64px; box-sizing: border-box">
    <div class="hb-in" style="font-family: 'Michroma', sans-serif; font-size: 15px; letter-spacing: 0.52em; margin-right: -0.52em; text-shadow: 0 0 24px rgba(255,236,210,0.45)">HAILMOS</div>
    <div style="flex: 1"></div>
    <div class="hb-in" style="text-align: center; animation-delay: .3s">
      <div style="font-family: 'Michroma', sans-serif; font-size: 11px; letter-spacing: 0.42em; margin-right: -0.42em; max-width: 300px; margin-left: auto; line-height: 1.9; text-wrap: balance; color: #fff1e0; text-shadow: 0 0 14px rgba(243,196,138,0.7)" id="h-rt">FROM EARTH</div>
      <div style="margin-top: 10px; font-size: 12px; letter-spacing: 0.08em; color: rgba(255,240,225,0.7)" id="h-rs">SET A COURSE</div>
    </div>
    <div class="hb-in" style="margin-top: 30px; margin-bottom: 18px; display: flex; align-items: center; gap: 36px; animation-delay: .45s">
      
      <button aria-label="출항" class="hb-btn hb-veil" style="position: relative; width: 84px; height: 84px; border-radius: 42px; padding: 0; border: 0; display: flex; align-items: center; justify-content: center; text-decoration: none; overflow: visible; background: rgba(8,5,10,0.12); box-shadow: inset 0 0 0 1px rgba(255,240,225,0.16)"><span aria-hidden="true" class="hb-breathe" style="position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,250,240,0.55), rgba(243,196,138,0.25) 45%, rgba(228,153,83,0) 100%)"></span><span aria-hidden="true" class="hb-rim"><span class="hb-rot-fast" style="position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; opacity: 1; background: conic-gradient(from 0deg, rgba(255,250,240,0) 0deg, rgba(255,250,240,0) 200deg, rgba(129,91,170,0.5) 255deg, #e49953 315deg, #fff6e8 352deg, rgba(255,250,240,0) 360deg)"></span></span><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" style="position: relative; fill: none; stroke: #fff7ee; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 5px rgba(255,220,180,0.6))"><path d="M12 18V5"></path><path d="M7 10l5-5 5 5"></path><circle cx="12" cy="20.6" r="0.6"></circle></svg></button>
      
    </div>
  </div>

      <div style="position:absolute;right:18px;top:10px" id="h-log"><button aria-label="항해 기록" class="hb-btn hb-veil" style="position: relative; width: 40px; height: 40px; border-radius: 20px; padding: 0; border: 0; display: flex; align-items: center; justify-content: center; background: rgba(8,5,10,0.12); box-shadow: inset 0 0 0 1px rgba(255,240,225,0.16)"><span aria-hidden="true" class="hb-rim"><span class="hb-rot-fast" style="position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; opacity: 0.6; background: conic-gradient(from 0deg, rgba(255,250,240,0) 0deg, rgba(255,250,240,0) 200deg, rgba(129,91,170,0.5) 255deg, #e49953 315deg, #fff6e8 352deg, rgba(255,250,240,0) 360deg)"></span></span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="position: relative; fill: none; stroke: #fff7ee; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 3px rgba(255,220,180,0.55))"><ellipse cx="12" cy="12" rx="9.2" ry="4" transform="rotate(-45 12 12)"></ellipse><circle cx="12" cy="12" r="2.2"></circle><circle cx="17.6" cy="6.4" r="0.9"></circle></svg></button></div>
    </div>
  </div>

  <div id="landed" class="layer" aria-live="polite" style="background:linear-gradient(180deg,rgba(0,0,0,0) 62%,rgba(0,0,0,0.85) 82%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom) + 40px);box-sizing:border-box">
    <div style="font-family:'Michroma',sans-serif;font-size:10px;letter-spacing:.42em;margin-right:-.42em;color:#ece4ff;text-shadow:0 0 12px rgba(140,115,225,.75)">LANDED</div>
    <div id="l-rt" style="margin-top:12px;max-width:330px;padding:0 30px;text-align:center;line-height:1.7;text-wrap:balance;font-family:'Michroma',sans-serif;font-size:13px;letter-spacing:.1em;color:#fff3e2"></div>
    <div id="l-home" style="margin-top:26px"><button aria-label="홈으로" class="hb-btn hb-veil" style="position: relative; width: 52px; height: 52px; border-radius: 26px; padding: 0; border: 0; display: flex; align-items: center; justify-content: center; background: rgba(8,5,10,0.12); box-shadow: inset 0 0 0 1px rgba(255,240,225,0.16)"><span aria-hidden="true" class="hb-breathe" style="position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,250,240,0.55), rgba(243,196,138,0.25) 45%, rgba(228,153,83,0) 100%)"></span><span aria-hidden="true" class="hb-rim"><span class="hb-rot-fast" style="position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; opacity: 1; background: conic-gradient(from 0deg, rgba(255,250,240,0) 0deg, rgba(255,250,240,0) 200deg, rgba(129,91,170,0.5) 255deg, #e49953 315deg, #fff6e8 352deg, rgba(255,250,240,0) 360deg)"></span></span><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" style="position: relative; fill: none; stroke: #fff7ee; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 3px rgba(255,220,180,0.55))"><path d="M4.5 11.5L12 5l7.5 6.5"></path><path d="M7 10v8.5h10V10"></path><path d="M10.5 18.5v-4h3v4"></path></svg></button></div>
  </div>

  <!-- timer sheet -->
  <div id="sheet" class="layer" aria-label="집중 시간과 항로 선택">
    <button class="handle" id="s-close" aria-label="닫기"><span></span></button>
    <div style="position:absolute;left:0;right:0;top:0;padding-top:calc(env(safe-area-inset-top) + 44px)">
      <div style="padding:0 20px;display:flex;justify-content:space-between;align-items:baseline"><span style="font-family:'Michroma',sans-serif;font-size:10px;letter-spacing:.42em;color:#f3c48a">TIMER</span><span id="s-flown" style="font-size:10px;color:rgba(255,234,210,.5)"></span></div>
